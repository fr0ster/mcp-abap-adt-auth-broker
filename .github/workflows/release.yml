name: Release

# One workspace per tag: `<dir>-v<version>`, as tools/publish-changed.js
# requires. The bare `v*.*.*` tags are the single package's history up to
# 3.0.4; nothing new is tagged that way.
on:
  push:
    tags:
      - 'auth-broker-v*'      # @mcp-abap-adt/auth-broker
      - 'auth-broker-cli-v*'  # @mcp-abap-adt/auth-broker-cli

permissions:
  contents: write  # Required for creating releases

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build workspaces
        run: npm run build

      - name: Shape check of the error contract
        run: npm run test:shape

      - name: Resolve the workspace the tag names
        id: workspace
        run: |
          TAG="${GITHUB_REF_NAME}"
          DIR="${TAG%-v*}"
          VERSION="${TAG##*-v}"
          if [ ! -f "packages/${DIR}/package.json" ]; then
            echo "Tag ${TAG} names no workspace: packages/${DIR} does not exist" >&2
            exit 1
          fi
          LOCAL=$(node -p "require('./packages/${DIR}/package.json').version")
          if [ "${LOCAL}" != "${VERSION}" ]; then
            echo "Tag ${TAG} says ${VERSION}, packages/${DIR}/package.json says ${LOCAL}" >&2
            exit 1
          fi
          echo "dir=${DIR}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # A semver prerelease (4.1.0-rc.1) is published under the npm tag
          # `next` by tools/publish-changed.js; its GitHub release says so too.
          case "${VERSION}" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Create package
        id: package
        run: |
          mkdir -p release
          npm pack --workspace "packages/${{ steps.workspace.outputs.dir }}" --pack-destination release
          PACKAGE_FILE=$(ls release/*.tgz)
          echo "filename=${PACKAGE_FILE}" >> "$GITHUB_OUTPUT"
          echo "Package created: ${PACKAGE_FILE}"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.package.outputs.filename }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.workspace.outputs.prerelease == 'true' }}
          body: |
            ## Installation

            Download the `.tgz` package and install:

            ```bash
            npm install -g ./${{ steps.package.outputs.filename }}
            ```

            ## What's Changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
