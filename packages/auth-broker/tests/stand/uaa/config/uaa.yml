scim:
  users:
    # For the interactive authorization-code login the tests perform.
    - tester|tester|tester@example.com|Test|User|uaa.user

oauth:
  user:
    authorities: [openid, uaa.user]
  clients:
    # The UAA suite registers Keycloak as a SAML identity provider at run time,
    # from the metadata Keycloak publishes — its keys are generated per start.
    stand_admin:
      id: stand_admin
      secret: secret
      authorized-grant-types: client_credentials
      authorities: 'idps.read,idps.write'
    # Saml2BearerProvider end to end: an assertion Keycloak issued after a real
    # login, exchanged here.
    saml_kc:
      id: saml_kc
      secret: secret
      authorized-grant-types: 'urn:ietf:params:oauth:grant-type:saml2-bearer,refresh_token'
      scope: 'openid,uaa.user'
      authorities: uaa.none
      autoapprove: 'true'
      allowedproviders: [keycloak]
    # ClientCredentialsProvider.
    cc_client:
      id: cc_client
      secret: secret
      authorized-grant-types: client_credentials
      authorities: uaa.resource
    # UaaPasscodeProvider: the user fetches a one-time code from /passcode in a
    # browser; the provider exchanges it through the password grant.
    passcode_client:
      id: passcode_client
      secret: secret
      authorized-grant-types: 'password,refresh_token'
      scope: 'openid,uaa.user'
      authorities: uaa.none
      autoapprove: 'true'
    # AuthorizationCodeProvider: the tests log in through UAA's own form.
    authcode:
      id: authcode
      secret: secret
      authorized-grant-types: 'authorization_code,refresh_token'
      scope: 'openid,uaa.user'
      authorities: uaa.none
      autoapprove: 'true'
      redirect-uri: 'http://localhost/callback'
    # May spend refresh tokens: UAA issues one with the saml2-bearer token.
    saml_rt:
      id: saml_rt
      secret: secret
      authorized-grant-types: 'urn:ietf:params:oauth:grant-type:saml2-bearer,refresh_token'
      scope: 'openid,uaa.user'
      authorities: uaa.none
      autoapprove: 'true'
      allowedproviders: [test-idp]
    # May not: UAA issues no refresh token, and the provider must log in again.
    saml_nort:
      id: saml_nort
      secret: secret
      authorized-grant-types: 'urn:ietf:params:oauth:grant-type:saml2-bearer'
      scope: 'openid,uaa.user'
      authorities: uaa.none
      autoapprove: 'true'
      allowedproviders: [test-idp]
